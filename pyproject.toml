[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-tcn"
version = "0.1.0"
description = "Causal liquid wrench surrogate with validated discrete consistency objectives"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "tensorboard>=2.12", "tqdm>=4.66"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
liquid-tcn = "liquid_tcn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
liquid_tcn = ["baselines/*.json"]
